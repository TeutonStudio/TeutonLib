modLoader="kotlinforforge"
loaderVersion="[${kotlin_for_forge_version},6)"
license="${mod_license}"
issueTrackerURL="https://github.com/TeutonStudio/TeutonLib/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/TeutonStudio/TeutonLib"
description='''${mod_description}'''

[[mixins]]
config="teutonlib.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kotlinforforge"
type="required"
versionRange="[${kotlin_for_forge_version},6)"
ordering="BEFORE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create_new_age"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="simulated"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aeronautics"
type="optional"
versionRange="${aeronautics_mod_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cso"
type="incompatible"
versionRange="*"
reason="TeutonLib includes CSO. Remove the standalone Create Sable Optimization mod."
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="computercraft"
type="optional"
versionRange="[1.119.0,1.121.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cc_aeroworks"
type="optional"
versionRange="[1.4.0,1.5.0)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="drivebywire"
type="optional"
versionRange="[0.3.0,0.4.0)"
ordering="AFTER"
side="BOTH"
